name: Reproducibility checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R 4.5.2
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - name: Verify standalone UCEI scoring and checksums
        run: Rscript scripts/publication/01_verify_ucei_scoring.R .

      - name: Verify Figure 1-6 source-data package
        run: Rscript scripts/publication/20_verify_figure_source_data.R source_data
